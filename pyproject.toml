[project]
name = "qa-test-project"
version = "0.1.0"
description = "Image comparison slider web application"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.messages_control]
disable = [
    "C0111",
    "R0913",
]

[tool.pylint.format]
max-line-length = 100
